<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18191c">
  <title>palette generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --base00: #18191c;
      --base01: #25272c;
      --base02: #3b3e45;
      --base03: #686c74;
      --base04: #a6a9b0;
      --base05: #e4e5e7;
      --base06: #f0f1f2;
      --base07: #fafafa;
      --base08: #777b84;
      --base09: #858992;
      --base0A: #92969e;
      --base0B: #9da1a9;
      --base0C: #a8acb3;
      --base0D: #8b9099;
      --base0E: #969ba4;
      --base0F: #b1b4ba;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      padding: clamp(20px, 4vw, 52px);
      background:
        radial-gradient(circle at 85% 4%, color-mix(in srgb, var(--base0F) 14%, transparent), transparent 32rem),
        var(--base00);
      color: var(--base05);
      font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
      transition: background-color 800ms ease, color 800ms ease;
    }

    main {
      width: min(100%, 1340px);
      margin: auto;
      animation: page-in 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 220px);
      align-items: start;
      gap: clamp(16px, 2vw, 26px);
    }

    .showcase { min-width: 0; }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 220px);
      align-items: end;
      gap: clamp(16px, 2vw, 26px);
      margin-bottom: clamp(24px, 4vw, 40px);
    }

    h1 {
      margin: 0;
      display: inline-flex;
      align-items: baseline;
      font-size: clamp(2.4rem, 7vw, 5.8rem);
      font-weight: 560;
      letter-spacing: -.04em;
      line-height: .86;
      cursor: pointer;
      transform-origin: left center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1:focus-visible {
      border-radius: 8px;
      outline: 3px solid var(--base05);
      outline-offset: 8px;
    }

    .title-prefix {
      display: inline-block;
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      white-space: nowrap;
      transform: translateX(-.18em);
    }

    .title-main { display: inline-block; white-space: nowrap; }

    h1.title-sequence .title-prefix {
      animation: prefix-sequence 3000ms cubic-bezier(.2,.8,.2,1);
    }

    h1.title-sequence .title-main {
      animation: main-sequence 3000ms cubic-bezier(.2,.8,.2,1);
    }

    button {
      border: 0;
      font: inherit;
    }

    .header-actions {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .palette-controls {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .palette-controls .polarity-control {
      display: grid;
      grid-template-columns: 48px 38px 48px;
    }

    .palette-controls .polarity-control > span:first-child { text-align: right; }

    .generator-control {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 3px;
      border: 1px solid color-mix(in srgb, var(--base04) 28%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--base01) 88%, transparent);
      transition: border-color 300ms ease, background-color 500ms ease;
    }

    .generator-option {
      position: relative;
      cursor: pointer;
    }

    .generator-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    .generator-option span {
      display: block;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--base04);
      font-size: .66rem;
      font-weight: 650;
      text-align: center;
      opacity: .55;
      transition:
        color 350ms ease,
        opacity 250ms ease,
        background-color 450ms ease;
    }

    .generator-option input:checked + span {
      background: var(--base05);
      color: var(--base00);
      opacity: 1;
    }

    .generator-option input:focus-visible + span {
      outline: 3px solid var(--base07);
      outline-offset: 3px;
    }

    .polarity-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--base04);
      font-size: .68rem;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
    }

    .polarity-control > span:not(.polarity-track) {
      opacity: .5;
      transition: color 400ms ease, opacity 250ms ease;
    }

    .polarity-control > span:first-child,
    .polarity-control:has(input:checked) > span:last-child {
      color: var(--base05);
      opacity: 1;
    }

    .polarity-control:has(input:checked) > span:first-child {
      color: var(--base04);
      opacity: .5;
    }

    .polarity-control input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }

    .polarity-track {
      position: relative;
      width: 38px;
      height: 22px;
      border: 1px solid color-mix(in srgb, var(--base04) 28%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--base01) 88%, transparent);
      transition: border-color 300ms ease, background-color 500ms ease;
    }

    .polarity-track::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--base05);
      box-shadow: 0 2px 8px rgb(0 0 0 / 24%);
      transition: transform 350ms cubic-bezier(.2,.8,.2,1), background-color 500ms ease;
    }

    .polarity-control input:checked + .polarity-track::after {
      transform: translateX(16px);
    }

    .polarity-control input:focus-visible + .polarity-track {
      outline: 3px solid var(--base07);
      outline-offset: 3px;
    }

    .generate {
      min-width: 150px;
      border-radius: 999px;
      padding: 13px 19px;
      background: var(--base05);
      color: var(--base00);
      font-size: .82rem;
      font-weight: 720;
      cursor: pointer;
      transition:
        transform 300ms cubic-bezier(.2,.8,.2,1),
        box-shadow 300ms ease,
        background-color 700ms ease;
    }

    .generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--base00) 45%, transparent);
    }

    .generate:active { transform: scale(.97); }
    .generate:disabled { cursor: wait; opacity: .68; }
    .generate:focus-visible, .swatch:focus-visible {
      outline: 3px solid var(--base07);
      outline-offset: 3px;
    }

    .generation-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .url-prompt,
    .continue-generation {
      width: 42px;
      height: 42px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--base04) 22%, transparent);
      border-radius: 50%;
      background: var(--base01);
      color: var(--base05);
      cursor: pointer;
      transition:
        transform 300ms cubic-bezier(.2,.8,.2,1),
        background-color 500ms ease,
        opacity 250ms ease;
    }

    .url-prompt svg,
    .continue-generation svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .continue-generation {
      font-size: .76rem;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .url-prompt:hover:not(:disabled),
    .continue-generation:hover:not(:disabled) { transform: translateY(-2px); }
    .url-prompt:active:not(:disabled),
    .continue-generation:active:not(:disabled) { transform: scale(.92); }
    .url-prompt:disabled,
    .continue-generation:disabled { opacity: .35; cursor: not-allowed; }
    .url-prompt:focus-visible,
    .continue-generation:focus-visible {
      outline: 3px solid var(--base07);
      outline-offset: 3px;
    }

    .wallpaper {
      --wallpaper-radius: 28px;
      position: relative;
      z-index: 2;
      min-height: min(55vw, 610px);
      overflow: hidden;
      border-radius: var(--wallpaper-radius);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      mask-image: linear-gradient(white, white);
      contain: paint;
      isolation: isolate;
      transform: translateZ(0);
      backface-visibility: hidden;
      background: var(--base01);
      box-shadow: 0 24px 80px rgb(0 0 0 / 24%);
      transition: background-color 700ms ease;
    }

    .wallpaper img {
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      position: absolute;
      inset: -1px;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 900ms ease;
      will-change: opacity;
    }

    .wallpaper img.loaded {
      opacity: 1;
    }

    .shade {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, transparent 48%, rgb(0 0 0 / 70%));
      pointer-events: none;
    }

    .meta {
      position: absolute;
      right: 66px;
      bottom: 22px;
      left: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 600ms ease 200ms, transform 600ms cubic-bezier(.2,.8,.2,1) 200ms;
    }

    .meta.visible { opacity: 1; transform: none; }
    .meta p { max-width: 70ch; margin: 0; color: #fff; font-size: .78rem; line-height: 1.5; }
    .meta-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }
    .meta a,
    .meta button {
      padding: 0;
      background: none;
      color: #fff;
      font-size: .75rem;
      text-decoration: underline;
      text-decoration-color: rgb(255 255 255 / 35%);
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .meta a:hover,
    .meta button:hover { text-decoration-color: #fff; }

    .regenerate {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 4;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 20%);
      border-radius: 50%;
      background: rgb(255 255 255 / 92%);
      color: #18191c;
      box-shadow: 0 10px 32px rgb(0 0 0 / 28%);
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition:
        transform 300ms cubic-bezier(.2,.8,.2,1),
        background-color 250ms ease,
        opacity 250ms ease;
    }

    .regenerate svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .regenerate:hover { transform: translateY(-2px) rotate(-12deg); }
    .regenerate:active { transform: scale(.92); }
    .regenerate:disabled { opacity: .45; cursor: wait; }
    .regenerate:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      color: var(--base04);
      font-size: .82rem;
      letter-spacing: .02em;
      transition: opacity 300ms ease;
    }

    .loader::before {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border: 2px solid color-mix(in srgb, var(--base04) 20%, transparent);
      border-top-color: var(--base04);
      border-radius: 50%;
      opacity: 0;
      animation: spin 900ms linear infinite;
    }

    .loading .loader::before { opacity: 1; }
    .loading .loader span { transform: translateY(45px); }
    .loader span { transition: transform 350ms cubic-bezier(.2,.8,.2,1); }
    .has-image .loader { opacity: 0; pointer-events: none; }

    .palette-dock {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: 0px 1fr;
      transition:
        grid-template-rows 700ms cubic-bezier(.2,.8,.2,1),
        margin-top 700ms cubic-bezier(.2,.8,.2,1);
    }

    .palette-dock.generating {
      grid-template-rows: 58px 0fr;
      margin-top: -18px;
    }

    .palette-status,
    .palette-reveal {
      min-height: 0;
      overflow: hidden;
    }

    .palette-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--base04);
      font-size: .72rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 350ms ease, transform 500ms cubic-bezier(.2,.8,.2,1);
    }

    .palette-dock.generating .palette-status {
      opacity: 1;
      transform: translateY(8px);
    }

    .palette-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid color-mix(in srgb, var(--base04) 20%, transparent);
      border-top-color: var(--base04);
      border-radius: 50%;
      animation: spin 850ms linear infinite;
    }

    .palette-reveal {
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity 450ms ease 180ms,
        transform 750ms cubic-bezier(.2,.8,.2,1);
    }

    .palette-dock.generating .palette-reveal {
      opacity: 0;
      transform: translateY(-80px);
      transition-delay: 0ms;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin: 0;
      padding: 10px 0 18px;
    }

    .swatch {
      min-width: 0;
      aspect-ratio: 1 / .92;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: start;
      justify-content: end;
      border-radius: 16px;
      background-color: var(--color);
      color: var(--ink);
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px) scale(.97);
      animation: swatch-in 520ms cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: calc(var(--i) * 32ms);
      transition:
        transform 300ms cubic-bezier(.2,.8,.2,1),
        border-radius 300ms ease,
        filter 300ms ease,
        background-color 650ms cubic-bezier(.2,.8,.2,1),
        color 650ms ease;
    }

    .swatch.fade-only {
      transform: none;
      animation-name: swatch-fade;
      animation-duration: 500ms;
      animation-delay: 0ms;
    }

    .swatch:hover {
      z-index: 1;
      border-radius: 22px;
      filter: brightness(1.06) saturate(1.08);
      transform: translateY(-4px) scale(1.025);
    }

    .swatch:active { transform: scale(.96); }
    .swatch strong, .swatch small {
      overflow: hidden;
      max-width: 100%;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
    }
    .swatch strong { font-size: .68rem; }
    .swatch small { margin-top: 3px; font-size: .62rem; opacity: .7; }

    .history {
      position: sticky;
      top: 24px;
      min-width: 0;
      margin: 0;
    }

    .history-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .history h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 680;
      letter-spacing: -.02em;
    }

    .history-count {
      margin: 0;
      color: var(--base04);
      font-size: .72rem;
    }

    .history-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 4px 6px 10px 0;
      scrollbar-color: color-mix(in srgb, var(--base04) 25%, transparent) transparent;
      scrollbar-width: thin;
    }

    .history-card {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      padding: 0;
      border-radius: 15px;
      background: var(--base01);
      color: white;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      animation: swatch-in 500ms cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: calc(var(--i) * 35ms);
      transition:
        transform 300ms cubic-bezier(.2,.8,.2,1),
        border-radius 300ms ease,
        background-color 550ms ease;
    }

    .history-card:hover {
      z-index: 1;
      border-radius: 21px;
      transform: translateY(-4px) scale(1.02);
    }

    .history-card:active { transform: scale(.97); }

    .history-card:disabled {
      cursor: wait;
    }

    .history-card.is-generating:hover,
    .history-card.is-generating:active,
    .history-card.is-placeholder:hover,
    .history-card.is-placeholder:active {
      border-radius: 15px;
      transform: none;
    }

    .history-card.is-placeholder {
      background: color-mix(in srgb, var(--base02) 72%, var(--base01));
    }

    .history-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition:
        transform 650ms cubic-bezier(.2,.8,.2,1),
        filter 350ms ease,
        opacity 350ms ease;
    }

    .history-card:hover img { transform: scale(1.055); filter: saturate(1.08); }

    .history-card.is-generating img,
    .history-card.is-generating:hover img {
      opacity: .58;
      filter: brightness(.62) saturate(.72);
      transform: none;
    }

    .history-card.is-placeholder .history-thumbnail-current,
    .history-card.is-blur-transition .history-thumbnail-current,
    .history-card.is-blur-transition:hover .history-thumbnail-current {
      opacity: .48;
      filter: blur(16px) brightness(.66) saturate(.72);
      transform: scale(1.18);
    }

    .history-card.is-placeholder .history-thumbnail-current {
      animation: placeholder-blur 1200ms ease-in-out infinite alternate;
    }

    .history-card.is-placeholder.is-skip-animating .history-thumbnail-current {
      animation: none;
    }

    .history-card.is-skip-placeholder {
      background-color: #202124;
    }

    .history-card.is-skip-placeholder.is-skip-background-fading {
      background-color: var(--base01);
    }

    .history-card.is-skip-placeholder .history-thumbnail-current,
    .history-card.is-skip-placeholder:hover .history-thumbnail-current {
      opacity: 0;
      filter: none;
      transform: none;
      animation: none;
    }

    .history-card.is-skip-placeholder .history-thumbnail-current.is-visible {
      opacity: .58;
    }

    .history-card.is-blur-transition .history-thumbnail-current.is-fading {
      opacity: 0;
    }

    .history-card.is-blur-transition .history-thumbnail-incoming {
      position: absolute;
      inset: 0;
      opacity: 0;
      filter: blur(16px) brightness(.66) saturate(.72);
      transform: scale(1.18);
    }

    .history-card.is-blur-transition .history-thumbnail-incoming.is-visible {
      opacity: .58;
    }

    .history-card.is-skip-placeholder .history-thumbnail-incoming {
      filter: brightness(.62) saturate(.72);
      transform: none;
    }

    .history-timestamp {
      position: absolute;
      right: 8px;
      bottom: 8px;
      left: 8px;
      overflow: hidden;
      padding: 16px 8px 7px;
      border-radius: 9px;
      background: linear-gradient(transparent, rgb(0 0 0 / 65%));
      font-size: .63rem;
      font-weight: 650;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-progress {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 7px;
      background: rgb(0 0 0 / 12%);
      color: white;
      font-size: .63rem;
      font-weight: 680;
      letter-spacing: .01em;
      transition: opacity 420ms ease;
    }

    .history-card.is-placeholder-entering .history-progress { opacity: 0; }

    .history-spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgb(255 255 255 / 28%);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .history-empty {
      margin: 0;
      padding: 26px;
      border: 1px dashed color-mix(in srgb, var(--base04) 20%, transparent);
      border-radius: 15px;
      color: var(--base04);
      font-size: .76rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      padding: 10px 15px;
      border: 1px solid color-mix(in srgb, var(--base05) 14%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--base00) 88%, transparent);
      color: var(--base05);
      font-size: .76rem;
      backdrop-filter: blur(16px);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 220ms ease, transform 350ms cubic-bezier(.2,.8,.2,1);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes page-in { from { opacity: 0; transform: translateY(10px); } }
    @keyframes swatch-in { to { opacity: 1; transform: none; } }
    @keyframes swatch-fade { to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes placeholder-blur {
      to {
        opacity: .3;
        filter: blur(21px) brightness(.58) saturate(.62);
      }
    }
    @keyframes prefix-sequence {
      0%, 100% {
        max-width: 0;
        opacity: 0;
        transform: translateX(-.18em);
      }
      12%, 72% {
        max-width: 2.42em;
        opacity: 1;
        transform: translateX(0);
      }
      84% {
        max-width: 0;
        opacity: 0;
        transform: translateX(-.18em);
      }
    }

    @keyframes main-sequence {
      0%, 84%, 100% { transform: translateX(0); }
      12%, 72% { transform: translateX(-.08em); }
    }
    @media (max-width: 780px) {
      header { grid-template-columns: 1fr; }
      .header-actions { justify-self: start; align-items: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .history {
        position: static;
        margin-top: 38px;
      }
      .history-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        max-height: none;
        overflow: visible;
        padding: 0;
      }
      .palette { grid-template-columns: repeat(4, 1fr); }
      .wallpaper {
        --wallpaper-radius: 22px;
        min-height: 58svh;
      }
    }

    @media (max-width: 430px) {
      body { padding: 18px; }
      .palette { grid-template-columns: repeat(2, 1fr); }
      .swatch { aspect-ratio: 1.6; }
      .meta { align-items: start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 role="button" tabindex="0" aria-label="animate title">
          <span class="title-prefix">stylix&nbsp;</span>
          <span class="title-main">palette generator</span>
        </h1>
      </div>
      <div class="header-actions">
        <div class="palette-controls">
          <div class="generator-control" role="radiogroup" aria-label="palette generator">
            <label class="generator-option">
              <input type="radio" name="generator" value="stylix" checked>
              <span>stylix</span>
            </label>
            <label class="generator-option">
              <input type="radio" name="generator" value="matugen">
              <span>matugen</span>
            </label>
            <label class="generator-option">
              <input type="radio" name="generator" value="pywal16">
              <span>pywal</span>
            </label>
          </div>
          <label class="polarity-control">
            <span>dark</span>
            <input class="polarity-toggle" type="checkbox" aria-label="use light polarity">
            <span class="polarity-track" aria-hidden="true"></span>
            <span>light</span>
          </label>
        </div>
        <div class="generation-actions">
          <button class="generate" type="button">generate</button>
          <button
            class="continue-generation"
            type="button"
            aria-label="keep this palette generating and start another wallpaper"
            title="keep generating and start another"
            disabled
          >
            +1
          </button>
          <button
            class="url-prompt"
            type="button"
            aria-label="generate from an image url"
            title="generate from image url"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.6 13.4a4 4 0 0 0 5.66 0l2.12-2.12a4 4 0 0 0-5.66-5.66l-1.21 1.21"></path>
              <path d="M13.4 10.6a4 4 0 0 0-5.66 0l-2.12 2.12a4 4 0 0 0 5.66 5.66l1.21-1.21"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <div class="showcase">
        <section class="wallpaper" aria-live="polite">
          <div class="loader"><span>ready for a wallpaper</span></div>
          <img alt="">
          <div class="shade"></div>
          <div class="meta">
            <p class="tags"></p>
            <div class="meta-actions">
              <a class="source" target="_blank" rel="noopener noreferrer">view on konachan</a>
              <button class="copy-image-url" type="button">copy image url</button>
              <button class="copy-hash" type="button">copy hash</button>
            </div>
          </div>
          <button
            class="regenerate"
            type="button"
            aria-label="regenerate this image palette"
            title="regenerate with current polarity"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5"></path>
              <path d="M19 12a7 7 0 1 0-2.05 4.95"></path>
            </svg>
          </button>
        </section>

        <div class="palette-dock">
          <div class="palette-status" role="status">
            <span class="palette-spinner"></span>
            <span>generating palette…</span>
          </div>
          <div class="palette-reveal">
            <section class="palette" aria-label="generated base16 palette"></section>
          </div>
        </div>
      </div>

      <section class="history">
        <div class="history-head">
          <h2>history</h2>
          <p class="history-count">0 generations</p>
        </div>
        <div class="history-list">
          <p class="history-empty">generated wallpapers will stay here.</p>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" role="status"></div>

  <script>
    const root = document.documentElement;
    const title = document.querySelector("h1");
    const stage = document.querySelector(".wallpaper");
    let activeImage = stage.querySelector("img");
    const loaderText = stage.querySelector(".loader span");
    const meta = stage.querySelector(".meta");
    const tags = stage.querySelector(".tags");
    const source = stage.querySelector(".source");
    const copyImageUrl = stage.querySelector(".copy-image-url");
    const copyHash = stage.querySelector(".copy-hash");
    const paletteDock = document.querySelector(".palette-dock");
    const palette = document.querySelector(".palette");
    const historyList = document.querySelector(".history-list");
    const historyCount = document.querySelector(".history-count");
    const generate = document.querySelector(".generate");
    const continueGeneration = document.querySelector(".continue-generation");
    const polarityToggle = document.querySelector(".polarity-toggle");
    const urlPrompt = document.querySelector(".url-prompt");
    const regenerate = document.querySelector(".regenerate");
    const toast = document.querySelector(".toast");
    const HISTORY_INITIAL_LIMIT = 10;
    let toastTimer;
    let historyRequestVersion = 0;
    let historyRecords = [];
    let historyNextCursor = null;
    let historyHasMore = false;
    let historyPageLoading = false;
    const generationWatches = new Map();
    let generationVersion = 0;
    let canSkip = false;
    let activeGenerationCount = 0;
    let foregroundGenerationId = null;
    let currentRecordId = null;

    const playTitleSequence = () => {
      title.classList.remove("title-sequence");
      void title.offsetWidth;
      title.classList.add("title-sequence");
    };

    const readableInk = (hex) => {
      const [r, g, b] = hex.match(/\w\w/g).map((part) => parseInt(part, 16) / 255);
      const linear = [r, g, b].map((value) =>
        value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4
      );
      return (.2126 * linear[0] + .7152 * linear[1] + .0722 * linear[2]) > .38
        ? "#18191c"
        : "#fafafa";
    };

    const notify = (message) => {
      toast.textContent = String(message).toLowerCase();
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    };

    const updateHistoryCount = (count) => {
      const suffix = historyHasMore ? "+" : "";
      historyCount.textContent = `${count}${suffix} generation${count === 1 ? "" : "s"}`;
    };

    const renderPalette = (colors, fade = false) => {
      const entries = Object.entries(colors);
      const existing = [...palette.querySelectorAll(".swatch")];

      if (fade && existing.length === entries.length) {
        entries.forEach(([name, raw], index) => {
          const hex = `#${raw.toLowerCase()}`;
          root.style.setProperty(`--${name}`, hex);
          const button = existing[index];
          button.dataset.hex = hex;
          button.style.setProperty("--color", hex);
          button.style.setProperty("--ink", readableInk(raw));
          button.querySelector("strong").textContent = name.toLowerCase();
          button.querySelector("small").textContent = hex;
        });
        return;
      }

      palette.replaceChildren();
      entries.forEach(([name, raw], index) => {
        const hex = `#${raw.toLowerCase()}`;
        root.style.setProperty(`--${name}`, hex);
        const button = document.createElement("button");
        button.type = "button";
        button.className = fade ? "swatch fade-only" : "swatch";
        button.dataset.hex = hex;
        button.style.cssText = `--i:${index};--color:${hex};--ink:${readableInk(raw)}`;
        const colorName = document.createElement("strong");
        const colorValue = document.createElement("small");
        colorName.textContent = name.toLowerCase();
        colorValue.textContent = hex;
        button.append(colorName, colorValue);
        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(button.dataset.hex);
          notify(`copied ${button.dataset.hex}`);
        });
        palette.append(button);
      });
    };

    const setStageLoading = (active, message = "") => {
      stage.classList.toggle("loading", active);
      if (message) loaderText.textContent = message;
    };

    const updateContinueAvailability = () => {
      continueGeneration.disabled = !canSkip || activeGenerationCount >= 4;
    };

    const setBusy = (active, label = "generating…", skippable = false) => {
      canSkip = skippable;
      generate.disabled = active && !skippable;
      urlPrompt.disabled = active && !skippable;
      regenerate.disabled = active || !currentRecordId;
      generate.textContent = active ? label : "generate again";
      updateContinueAvailability();
    };

    const setPaletteGenerating = (active) => {
      paletteDock.classList.toggle("generating", active);
    };

    const displayWallpaper = async (data) => {
      meta.classList.remove("visible");

      const incomingImage = document.createElement("img");
      incomingImage.alt = data.tags
        ? `anime wallpaper: ${data.tags}`
        : "generated anime wallpaper";
      incomingImage.decoding = "async";
      stage.insertBefore(incomingImage, stage.querySelector(".shade"));

      await new Promise((resolve, reject) => {
        incomingImage.onload = resolve;
        incomingImage.onerror = () => {
          incomingImage.remove();
          reject(new Error("the wallpaper could not be displayed"));
        };
        incomingImage.src = `${data.image}?v=${encodeURIComponent(data.id || Date.now())}`;
      });

      tags.textContent = data.tags.split(" ").slice(0, 14).join(" · ");
      source.href = data.post_url;
      source.textContent = data.source_label || "view on konachan";
      copyImageUrl.dataset.value = data.image_url || "";
      copyImageUrl.hidden = !data.image_url;
      copyHash.dataset.value = data.sha256 || "";
      copyHash.hidden = !data.sha256;
      currentRecordId = data.id;
      regenerate.disabled = false;
      stage.classList.add("has-image");

      const previousImage = activeImage;
      activeImage = incomingImage;
      void incomingImage.offsetWidth;
      requestAnimationFrame(() => {
        incomingImage.classList.add("loaded");
        meta.classList.add("visible");
      });

      setTimeout(() => {
        if (previousImage !== activeImage) previousImage.remove();
      }, 1450);
    };

    const displayRecord = async (data) => {
      await displayWallpaper(data);
      renderPalette(data.palette, true);
      setPaletteGenerating(false);
    };

    const createHistoryCard = (record, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "history-card";
      card.dataset.recordId = record.id;
      card.style.setProperty("--i", Math.min(index, 12));

      const thumbnail = document.createElement("img");
      const timestamp = document.createElement("span");
      thumbnail.className = "history-thumbnail-current";
      thumbnail.alt = "";
      timestamp.className = "history-timestamp";
      card.append(thumbnail, timestamp);
      card.addEventListener("click", async () => {
        const selected = card.historyRecord;
        if (!selected || selected.status !== "ready") return;
        try {
          await displayRecord(selected);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          notify(error.message);
        }
      });
      return card;
    };

    const crossfadeHistoryThumbnail = (card, thumbnail, image) => {
      card.querySelector(".history-thumbnail-incoming")?.remove();
      card.classList.add("is-blur-transition");
      const incoming = document.createElement("img");
      incoming.className = "history-thumbnail-incoming";
      incoming.alt = "";
      incoming.onload = () => {
        requestAnimationFrame(() => {
          thumbnail.classList.add("is-fading");
          card.classList.add("is-skip-background-fading");
          incoming.classList.add("is-visible");
        });
        const duration = matchMedia("(prefers-reduced-motion: reduce)").matches
          ? 0
          : 550;
        setTimeout(() => {
          incoming.classList.replace(
            "history-thumbnail-incoming",
            "history-thumbnail-current"
          );
          thumbnail.remove();
          requestAnimationFrame(() => {
            card.classList.remove("is-blur-transition");
            card.classList.remove("is-skip-placeholder");
            card.classList.remove("is-skip-background-fading");
            incoming.classList.remove("is-visible");
          });
        }, duration);
      };
      incoming.onerror = () => {
        incoming.remove();
        card.classList.remove("is-blur-transition");
        card.classList.remove("is-skip-placeholder");
        card.classList.remove("is-skip-background-fading");
      };
      card.insertBefore(incoming, card.querySelector(".history-timestamp"));
      incoming.src = image;
    };

    const updateHistoryCard = (card, record) => {
      const wasPlaceholder = card.classList.contains("is-placeholder");
      const isGenerating = record.status === "generating";
      const isPlaceholder = record.status === "fetching";
      const isPending = isGenerating || isPlaceholder;
      const date = new Date(record.created_at);
      const label = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(date).toLowerCase();
      card.historyRecord = record;
      card.classList.toggle("is-generating", isGenerating);
      card.classList.toggle("is-placeholder", isPlaceholder);
      card.disabled = isPending;
      card.title = isPlaceholder
        ? "fetching wallpaper"
        : isGenerating ? "generating palette" : record.tags;
      card.setAttribute(
        "aria-label",
        isPlaceholder
          ? "wallpaper fetch in progress"
          : isGenerating ? "palette generation in progress" : `open generation from ${label}`
      );
      const thumbnail = card.querySelector("img");
      if (record.image && thumbnail.getAttribute("src") !== record.image) {
        if (isPlaceholder && thumbnail.getAttribute("src")) {
          // Keep the decoded thumbnail mounted while Skip fades it to gray.
        } else if (
          wasPlaceholder &&
          (thumbnail.getAttribute("src") ||
            card.classList.contains("is-skip-placeholder")) &&
          !card.classList.contains("is-blur-transition")
        ) {
          crossfadeHistoryThumbnail(card, thumbnail, record.image);
        } else if (!card.classList.contains("is-blur-transition")) {
          thumbnail.src = record.image;
        }
      } else if (!record.image) {
        thumbnail.removeAttribute("src");
      }
      card.querySelector(".history-timestamp").textContent = label;

      let progress = card.querySelector(".history-progress");
      if (isPending && !progress) {
        progress = document.createElement("span");
        progress.className = "history-progress";
        const spinner = document.createElement("span");
        const progressLabel = document.createElement("span");
        spinner.className = "history-spinner";
        progressLabel.textContent = "generating…";
        progress.append(spinner, progressLabel);
        card.append(progress);
      } else if (!isPending) {
        progress?.remove();
      }
      if (progress) {
        progress.lastElementChild.textContent = isPlaceholder
          ? "fetching wallpaper…"
          : "generating…";
      }
    };

    const historyPlaceholderRecord = () => ({
        id: `pending-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        status: "fetching",
        created_at: new Date().toISOString(),
        image: activeImage?.currentSrc || activeImage?.src || "",
        tags: ""
    });

    const addHistoryPlaceholder = () => {
      historyList.querySelector(".history-empty")?.remove();
      const placeholder = historyPlaceholderRecord();
      const card = createHistoryCard(placeholder, 0);
      updateHistoryCard(card, placeholder);
      historyList.prepend(card);
      const count = historyList.querySelectorAll(".history-card").length;
      updateHistoryCount(count);
      requestAnimationFrame(sizeHistoryToFive);
      return card;
    };

    const animateSkipHistoryPlaceholder = (card) => {
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duration = reducedMotion ? 0 : 700;
      const thumbnail = card.querySelector(".history-thumbnail-current");
      card.classList.add("is-skip-placeholder");
      card.classList.add("is-skip-animating");
      const animation = thumbnail.animate(
        [
          {
            opacity: .58,
            filter: "brightness(.62) saturate(.72)",
            transform: "scale(1)"
          },
          {
            opacity: 0,
            filter: "brightness(.62) saturate(.72)",
            transform: "scale(1)"
          }
        ],
        { duration, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
      const transition = animation.finished.catch(() => {});
      card.skipTransition = transition.finally(() => {
        card.classList.remove("is-skip-animating");
        delete card.skipTransition;
      });
    };

    const reuseHistoryCardAsPlaceholder = (recordId) => {
      const card = [...historyList.querySelectorAll(".history-card")]
        .find((candidate) => candidate.dataset.recordId === recordId) ||
        historyList.querySelector(".history-card.is-generating");
      if (!card) return addHistoryPlaceholder();
      const placeholder = historyPlaceholderRecord();
      card.dataset.replacesRecordId = recordId;
      card.dataset.recordId = placeholder.id;
      updateHistoryCard(card, placeholder);
      animateSkipHistoryPlaceholder(card);
      return card;
    };

    const adoptHistoryPlaceholder = (card, record) => {
      delete card.dataset.replacesRecordId;
      card.dataset.recordId = record.id;
      updateHistoryCard(card, record);
    };

    const renderHistory = (records) => {
      const currentCards = [...historyList.querySelectorAll(".history-card")];
      const knownIds = new Set(
        currentCards
          .filter((card) => !card.classList.contains("is-placeholder"))
          .map((card) => card.dataset.recordId)
      );
      const replacedIds = new Set(
        currentCards
          .map((card) => card.dataset.replacesRecordId)
          .filter(Boolean)
      );
      const visibleRecords = records.filter((record) => !replacedIds.has(record.id));
      const newGeneratingRecords = visibleRecords.filter(
        (record) => record.status === "generating" &&
          !knownIds.has(record.id)
      );
      currentCards
        .filter((card) => card.classList.contains("is-placeholder"))
        .forEach((card, index) => {
          if (newGeneratingRecords[index]) {
            adoptHistoryPlaceholder(card, newGeneratingRecords[index]);
          }
        });

      const placeholderCount = historyList.querySelectorAll(".is-placeholder").length;
      const displayedCount = visibleRecords.length + placeholderCount;
      updateHistoryCount(displayedCount);
      activeGenerationCount = visibleRecords
        .filter((record) => record.status === "generating").length + placeholderCount;
      updateContinueAvailability();

      if (!visibleRecords.length) {
        historyList.querySelectorAll(".history-card:not(.is-placeholder)")
          .forEach((card) => card.remove());
        const placeholders = historyList.querySelectorAll(".is-placeholder").length;
        updateHistoryCount(placeholders);
        if (!placeholders && !historyList.querySelector(".history-empty")) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "generated wallpapers will stay here.";
          historyList.append(empty);
        }
        return false;
      }

      historyList.querySelector(".history-empty")?.remove();
      const liveIds = new Set(visibleRecords.map((record) => record.id));
      const existingCards = new Map(
        [...historyList.querySelectorAll(".history-card")].map((card) => [
          card.dataset.recordId,
          card
        ])
      );

      visibleRecords.forEach((record, index) => {
        const card = existingCards.get(record.id) || createHistoryCard(record, index);
        updateHistoryCard(card, record);
        const cardAtIndex = historyList.children[index + placeholderCount];
        if (cardAtIndex !== card) historyList.insertBefore(card, cardAtIndex || null);
      });

      existingCards.forEach((card, recordId) => {
        if (!liveIds.has(recordId) && !card.classList.contains("is-placeholder")) {
          card.remove();
        }
      });

      requestAnimationFrame(sizeHistoryToFive);
      return activeGenerationCount > 0;
    };

    const sizeHistoryToFive = () => {
      if (innerWidth <= 780) {
        historyList.style.maxHeight = "";
        return;
      }

      const firstCard = historyList.querySelector(".history-card");
      if (!firstCard) {
        historyList.style.maxHeight = "";
        return;
      }

      const styles = getComputedStyle(historyList);
      const gap = parseFloat(styles.rowGap) || 0;
      const padding = (parseFloat(styles.paddingTop) || 0) +
        (parseFloat(styles.paddingBottom) || 0);
      historyList.style.maxHeight = `${firstCard.offsetHeight * 5 + gap * 4 + padding}px`;
    };

    const loadHistory = async (displayLatest = true) => {
      const requestVersion = ++historyRequestVersion;
      const version = generationVersion;
      try {
        const response = await fetch(`/api/history?limit=${HISTORY_INITIAL_LIMIT}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "could not load history");
        if (requestVersion !== historyRequestVersion) return;
        const previousRecords = historyRecords;
        const previousHasMore = historyHasMore;
        const firstPageEnd = data.history.at(-1)?.id;
        const cachedOlderRecords = firstPageEnd
          ? previousRecords.filter((record) => record.id < firstPageEnd)
          : [];
        const firstPageIds = new Set(data.history.map((record) => record.id));
        historyRecords = [
          ...data.history,
          ...cachedOlderRecords.filter((record) => !firstPageIds.has(record.id))
        ];
        historyHasMore = cachedOlderRecords.length ? previousHasMore : Boolean(data.has_more);
        historyNextCursor = historyHasMore
          ? historyRecords.at(-1)?.id || data.next_cursor
          : null;
        const hasPending = renderHistory(historyRecords);
        const latestReady = data.history.find((record) => record.status !== "generating");
        if (displayLatest && !currentRecordId && version === generationVersion && latestReady) {
          await displayRecord(latestReady);
        }
        if (hasPending) data.history
          .filter((record) => record.status === "generating")
          .forEach(watchGeneration);
      } catch {
        if (requestVersion === historyRequestVersion) {
          historyCount.textContent = "unavailable";
        }
      }
    };

    const loadOlderHistory = async (limit = 1) => {
      if (historyPageLoading || !historyHasMore || !historyNextCursor) return;
      historyPageLoading = true;
      const requestVersion = historyRequestVersion;
      try {
        const parameters = new URLSearchParams({
          limit: String(Math.max(1, Math.min(limit, 50))),
          before: historyNextCursor
        });
        const response = await fetch(`/api/history?${parameters}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "could not load older history");
        if (requestVersion !== historyRequestVersion) return;
        const knownIds = new Set(historyRecords.map((record) => record.id));
        historyRecords.push(...data.history.filter((record) => !knownIds.has(record.id)));
        historyHasMore = Boolean(data.has_more);
        historyNextCursor = data.next_cursor;
        renderHistory(historyRecords);
      } catch (error) {
        if (requestVersion === historyRequestVersion) notify(error.message);
      } finally {
        historyPageLoading = false;
        if (innerWidth > 780) requestAnimationFrame(loadHistoryForScroll);
      }
    };

    const loadHistoryForScroll = () => {
      if (historyPageLoading || !historyHasMore) return;
      if (innerWidth <= 780) {
        const historyBottom = historyList.getBoundingClientRect().bottom;
        if (historyBottom <= innerHeight + 160) loadOlderHistory(1);
        return;
      }
      const firstCard = historyList.querySelector(".history-card");
      if (!firstCard || historyList.scrollTop <= 0) return;
      const styles = getComputedStyle(historyList);
      const rowStep = firstCard.offsetHeight + (parseFloat(styles.rowGap) || 0);
      const revealedRows = Math.ceil(historyList.scrollTop / rowStep);
      const desiredRecords = HISTORY_INITIAL_LIMIT + revealedRows;
      if (historyRecords.length < desiredRecords) {
        loadOlderHistory(desiredRecords - historyRecords.length);
      }
    };

    const pollGeneration = async (data) => {
      const deadline = Date.now() + 300000;
      const pollInterval = data.generator === "stylix" ? 900 : 150;
      let completed = data;
      while (completed.status === "generating") {
        if (Date.now() > deadline) throw new Error("palette generation timed out");
        await new Promise((resolve) => setTimeout(resolve, pollInterval));
        const response = await fetch(`/api/generation/${encodeURIComponent(data.id)}`);
        completed = await response.json();
        if (!response.ok) {
          throw new Error(completed.error || "could not read generation status");
        }
      }
      if (completed.status === "error") {
        throw new Error(completed.error || "stylix generation failed");
      }
      return completed;
    };

    const watchGeneration = (data) => {
      const existing = generationWatches.get(data.id);
      if (existing) return existing;
      const watch = pollGeneration(data);
      generationWatches.set(data.id, watch);
      watch.then(
        () => {
          generationWatches.delete(data.id);
          loadHistory(false);
        },
        () => {
          generationWatches.delete(data.id);
          loadHistory(false);
        }
      );
      return watch;
    };

    const generateWallpaper = async (skip = false, imageUrl = "", placeholderCard = null) => {
      const generationToSkip = skip ? foregroundGenerationId : null;
      const version = ++generationVersion;
      let placeholderAdopted = false;
      foregroundGenerationId = null;
      setBusy(true, skip ? "skipping…" : "fetching…");
      setStageLoading(true, imageUrl ? "fetching your image…" : "fetching a wallpaper…");
      setPaletteGenerating(true);

      try {
        const parameters = new URLSearchParams({
          polarity: polarityToggle.checked ? "light" : "dark",
          generator: document.querySelector('input[name="generator"]:checked').value
        });
        if (skip) parameters.set("skip", generationToSkip || "1");
        const endpoint = `/api/generate?${parameters}`;
        const options = { method: "POST" };
        if (imageUrl) {
          options.headers = { "Content-Type": "application/json" };
          options.body = JSON.stringify({ image_url: imageUrl });
        }
        const response = await fetch(endpoint, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "generation failed");
        if (placeholderCard?.skipTransition) {
          await placeholderCard.skipTransition;
        }
        if (placeholderCard) {
          adoptHistoryPlaceholder(placeholderCard, data);
          placeholderAdopted = true;
        }
        const completion = watchGeneration(data);
        if (version !== generationVersion) return;
        foregroundGenerationId = data.id;
        await loadHistory(false);

        await displayWallpaper(data);
        if (version !== generationVersion) return;
        setStageLoading(false);
        setBusy(true, "skip?", true);
        setPaletteGenerating(true);

        const completed = await completion;
        if (version !== generationVersion) return;

        renderPalette(completed.palette);
        setPaletteGenerating(false);
        await loadHistory();
      } catch (error) {
        if (
          !placeholderAdopted &&
          placeholderCard?.classList.contains("is-placeholder")
        ) {
          placeholderCard.remove();
          loadHistory(false);
        }
        if (version !== generationVersion) return;
        loaderText.textContent = error.message.toLowerCase();
        setPaletteGenerating(false);
        notify(error.message);
      } finally {
        if (version === generationVersion) {
          foregroundGenerationId = null;
          setStageLoading(false);
          setBusy(false);
        }
      }
    };

    const regenerateCurrent = async () => {
      if (!currentRecordId) {
        notify("generate an image first");
        return;
      }
      const version = ++generationVersion;
      foregroundGenerationId = null;
      setBusy(true, "generating…");
      setPaletteGenerating(true);
      try {
        const parameters = new URLSearchParams({
          polarity: polarityToggle.checked ? "light" : "dark",
          generator: document.querySelector('input[name="generator"]:checked').value
        });
        const response = await fetch(`/api/generate?${parameters}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ record_id: currentRecordId })
        });
        const data = await response.json();
        if (version !== generationVersion) return;
        if (!response.ok) throw new Error(data.error || "generation failed");
        foregroundGenerationId = data.id;
        await loadHistory(false);
        const completion = watchGeneration(data);
        setBusy(true, "skip?", true);

        const completed = await completion;
        if (version !== generationVersion) return;
        currentRecordId = completed.id;
        renderPalette(completed.palette, true);
        setPaletteGenerating(false);
        await loadHistory();
      } catch (error) {
        if (version !== generationVersion) return;
        setPaletteGenerating(false);
        notify(error.message);
      } finally {
        if (version === generationVersion) {
          foregroundGenerationId = null;
          setBusy(false);
        }
      }
    };

    const continueWithAnother = () => {
      if (!foregroundGenerationId || !canSkip) {
        notify("nothing is generating");
        return;
      }
      notify("continuing in history");
      generateWallpaper(false, "", addHistoryPlaceholder());
    };

    generate.addEventListener("click", () => {
      const placeholder = canSkip
        ? reuseHistoryCardAsPlaceholder(foregroundGenerationId)
        : null;
      generateWallpaper(canSkip, "", placeholder);
    });
    continueGeneration.addEventListener("click", continueWithAnother);
    urlPrompt.addEventListener("click", () => {
      const value = prompt("paste a public https image url");
      if (value === null) return;
      try {
        const imageUrl = new URL(value.trim());
        if (imageUrl.protocol !== "https:") throw new Error();
        const placeholder = canSkip
          ? reuseHistoryCardAsPlaceholder(foregroundGenerationId)
          : null;
        generateWallpaper(canSkip, imageUrl.href, placeholder);
      } catch {
        notify("please enter a valid https image url");
      }
    });
    regenerate.addEventListener("click", regenerateCurrent);
    title.addEventListener("click", playTitleSequence);
    title.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playTitleSequence();
      }
    });
    copyImageUrl.addEventListener("click", async () => {
      await navigator.clipboard.writeText(copyImageUrl.dataset.value);
      notify("copied image url");
    });
    copyHash.addEventListener("click", async () => {
      await navigator.clipboard.writeText(copyHash.dataset.value);
      notify("copied hash");
    });
    historyList.addEventListener("scroll", loadHistoryForScroll, { passive: true });
    addEventListener("scroll", loadHistoryForScroll, { passive: true });
    addEventListener("resize", () => {
      sizeHistoryToFive();
      loadHistoryForScroll();
    });
    loadHistory();
  </script>
</body>
</html>
